<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Search App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      flex: 1;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #45a049;
    }

    .error {
      color: red;
      margin-bottom: 10px;
      text-align: center;
    }

    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .student-card {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      border-left: 5px solid #4CAF50;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .student-card h3 {
      color: #333;
      margin-bottom: 8px;
    }

    .student-card p {
      margin: 4px 0;
      color: #555;
    }

    .no-data {
      text-align: center;
      color: red;
      margin-top: 20px;
      font-size: 18px;
    }

    @media(max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Search System</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter student name..." />
      
      <select id="genderFilter">
        <option value="all">All Categories</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <button onclick="searchStudent()">Search</button>
    </div>

    <div class="error" id="errorMsg"></div>

    <div class="student-list" id="studentList"></div>

    <div class="no-data" id="noData"></div>
  </div>

  <script>
    const apiBase = "https://69b06a9ac63dd197febc3a99.mockapi.io/student/student";

    async function fetchStudents(searchTerm = "") {
      let url = apiBase;

      if (searchTerm.trim() !== "") {
        url += `?search=${searchTerm}`;
      }

      try {
        const response = await fetch(url);
        const data = await response.json();
        return data;
      } catch (error) {
        console.error("Error fetching data:", error);
        return [];
      }
    }

    function displayStudents(students) {
      const studentList = document.getElementById("studentList");
      const noData = document.getElementById("noData");

      studentList.innerHTML = "";
      noData.innerHTML = "";

      if (students.length === 0) {
        noData.innerHTML = "No student found!";
        return;
      }

      students.forEach(student => {
        const card = document.createElement("div");
        card.classList.add("student-card");

        card.innerHTML = `
          <h3>${student.name}</h3>
          <p><strong>ID:</strong> ${student.id}</p>
          <p><strong>Email:</strong> ${student.email || "N/A"}</p>
          <p><strong>Gender:</strong> ${student.gender || "N/A"}</p>
        `;

        studentList.appendChild(card);
      });
    }

    async function searchStudent() {
      const searchInput = document.getElementById("searchInput").value.trim();
      const genderFilter = document.getElementById("genderFilter").value;
      const errorMsg = document.getElementById("errorMsg");

      errorMsg.innerHTML = "";

      if (searchInput === "") {
        errorMsg.innerHTML = "Please enter student name!";
        document.getElementById("studentList").innerHTML = "";
        document.getElementById("noData").innerHTML = "";
        return;
      }

      let students = await fetchStudents(searchInput);

      if (genderFilter !== "all") {
        students = students.filter(student =>
          student.gender &&
          student.gender.toLowerCase() === genderFilter.toLowerCase()
        );
      }

      displayStudents(students);
    }

    async function loadAllStudents() {
      const students = await fetchStudents();

      displayStudents(students);
    }

    loadAllStudents();
  </script>

</body>
</html>
